# ============================================================
# DevOps Lab 1 — Lighthouse CI
# Audit Performance, Accessibility, Best Practices, SEO
# mỗi khi push code lên nhánh main
# ============================================================

name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit live site with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://july0107.github.io/devops-lab1-portfolio/
            https://july0107.github.io/devops-lab1-portfolio/about.html
            https://july0107.github.io/devops-lab1-portfolio/contact.html
          uploadArtifacts: true
          temporaryPublicStorage: true
